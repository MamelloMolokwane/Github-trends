services:
  postgres:
    image: postgres:17
    container_name: github-trends-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: github-trends-app
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data: